name: CI

on:
  # No branch filter: stacked PRs target feature branches, not just master.
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json `packageManager`; pnpm then
      # runs scripts under `use-node-version` from .npmrc.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Cache PureScript packages
        uses: actions/cache@v4
        with:
          path: .spago
          key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # The same single gate as local development (see AGENTS.md).
      - run: pnpm check

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
