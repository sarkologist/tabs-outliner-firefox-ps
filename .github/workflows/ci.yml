name: CI

on:
  # No branch filter: stacked PRs target feature branches, not just master.
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every master commit gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned version from package.json `packageManager`; pnpm then
      # runs scripts under `use-node-version` from .npmrc.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Cache PureScript packages
        uses: actions/cache@v6
        with:
          path: .spago
          key: spago-${{ runner.os }}-${{ hashFiles('spago.lock') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # The same single gate as local development (see AGENTS.md).
      - run: pnpm check

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # The AMO source zip must rebuild the shipped dist/ (scripts/check-source-repro.mjs),
  # on Linux (a likely reviewer box) and macOS (where releases are built).
  source-repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # The script rebuilds under os.tmpdir(); keep it where a failure upload can see it.
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      # pnpm via Corepack, as the reviewer recipe in docs/reviewer-notes.md does.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check:source

      - uses: actions/upload-artifact@v7
        with:
          name: dist-digests-${{ matrix.os }}
          path: web-ext-artifacts/dist-digests.json

      - name: Upload both dist/ trees
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: source-repro-${{ matrix.os }}
          path: |
            dist/
            ${{ runner.temp }}/grove-source-repro-*/grove-source/dist/
          retention-days: 7

  # A reviewer on Linux must get the same bytes as an XPI built on macOS.
  source-repro-cross-os:
    needs: source-repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-digests-*
      - run: diff dist-digests-ubuntu-latest/dist-digests.json dist-digests-macos-latest/dist-digests.json
